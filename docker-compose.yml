version: '3.8'

services:
  web:
    build: .                 
    restart: unless-stopped
    ports:
      - "3000:3000"        
    depends_on:
      db:
        condition: service_healthy  
    environment:
     
      POSTGRES_DB: ${POSTGRES_DB:-circuito_saquarema}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db      
      POSTGRES_PORT: 5432
      # Se você usar Os como Prisma, TypeORM ou Sequelize no Node, descomente a linha abaixo:
      # DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-circuito_saquarema}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circuito_saquarema}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: